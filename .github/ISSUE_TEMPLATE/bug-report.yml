name: "🐞 Report a Formula or Web Calculator Bug"
description: "Report a reproducible calculation error, validation alert, or display bug in the web app or Excel workbook."
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: "Where did the issue occur?"
      options:
        - "All-in-One Excel Workbook (.xlsx) — Microsoft 365 / Excel 2021+"
        - "All-in-One Excel Workbook (.xlsx) — Older Excel Version"
        - "Free Online Web Calculator (GitHub Pages)"
        - "Google Sheets Preview"
    validations:
      required: true

  - type: input
    id: affected_tab
    attributes:
      label: "Affected worksheet or strategy"
      placeholder: "e.g., 03_Calculation_Engine / Fix-and-Flip Downside Scenario"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Expected vs. actual result"
      description: "Explain what you expected the calculator to show versus what actually happened."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce (synthetic example numbers only)"
      placeholder: |
        1. Select Strategy = Fix-and-Flip, Scenario = Base
        2. Enter Purchase Price = 300,000, Rehab = 60,000...
    validations:
      required: true

  - type: checkboxes
    id: privacy_check
    attributes:
      label: "Privacy & Data Safety Confirmation (Required)"
      options:
        - label: "I have removed all real property addresses, personal details, tax records, and confidential deal assumptions."
          required: true
